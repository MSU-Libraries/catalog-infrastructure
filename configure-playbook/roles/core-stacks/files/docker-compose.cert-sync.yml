---
services:
  cert-sync:
    image: "registry.gitlab.msu.edu/msu-libraries/catalog/cert-sync"
    environment:
      NODE_ID: "{{slice .Node.Hostname 8 9}}"
      CERTS: "/certs/"
      TRAEFIK: "/etc/traefik/"
    cap_drop:
      - CAP_NET_BIND_SERVICE
      - CAP_KILL
      - CAP_CHOWN
      - CAP_FSETID
      - CAP_SETGID
      - CAP_SETUID
    volumes:
      - traefik_traefik:/etc/traefik
      - "/mnt/shared/certs/${CLUSTER}:/certs"
    deploy:
      mode: global
      placement:
        max_replicas_per_node: 1
      restart_policy:
        delay: 24h
      update_config:
        failure_action: rollback
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

volumes:
  var_lib_docker:
  traefik_traefik:
    external: true
    name: "traefik_traefik"
