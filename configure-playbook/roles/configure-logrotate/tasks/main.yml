---

- name: Set logrotate timer to run hourly
  ansible.builtin.copy:
    dest: /etc/systemd/system/logrotate.timer.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=hourly
  notify: restart logrotate timer

- name: Copy logrotation file
  ansible.builtin.copy:
    src: "{{ role_path }}/files/logrotate.d/pubcat"
    dest: /etc/logrotate.d/pubcat
    owner: root
    group: root
    mode: '0644'

