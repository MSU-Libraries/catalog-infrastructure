---

- name: Ensure docker core services are happy
  ansible.builtin.command:
    cmd: /usr/local/ncpa/plugins/check_docker.sh --core-only
  run_once: true

- name: Restart traefik followers
  ansible.builtin.command:
    cmd: docker service update --force --update-parallelism 1 --update-delay 90s traefik_traefik
  run_once: true

- name: Verify docker core services remained happy
  ansible.builtin.shell: |
    sleep 15;
    SERVICE="docker core";
    HEALTHY=0;
    ATTEMPTS=0;
    while [[ ${ATTEMPTS} -le 10 ]]; do
        echo "$(date +'%m-%d-%Y %T %z') -- Checking ${SERVICE} health...";
        if /usr/local/ncpa/plugins/check_docker.sh --core-only; then
            echo "$(date +'%m-%d-%Y %T %z') -- ${SERVICE} is healthy!";
            HEALTHY=1;
            break;
        fi
        echo "$(date +'%m-%d-%Y %T %z') -- ${SERVICE} not healthy yet. Waiting...";
        sleep 15;
        ATTEMPTS=$((ATTEMPTS+1));
    done
    if [[ ${HEALTHY} -ne 1 ]]; then
        echo "$(date +'%m-%d-%Y %T %z') -- ${SERVICE} not healthy after max attempts. Failing job!";
        exit 1;
    fi;
  run_once: true
